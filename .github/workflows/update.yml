name: 統計の自動更新

on:
  schedule:
    - cron: "0 0 * * 1"     # 日本時間 毎週月曜の朝9:00（UTC 0:00）。新しい数字が出ていなければ、何も変わりません
  workflow_dispatch:         # 手動実行ボタン

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: PDFを読む部品を入れる
        run: pip install pypdf
      - name: 公式のPDFから数字を読み取って data.json を更新（読み取れないときは書き換えず、失敗で知らせる）
        run: python update_stats.py
      - name: 変更があれば保存（サイトは保存をきっかけに自動で更新されます）
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json index.html
          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -m "統計の自動更新 $(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M')"
            git pull --rebase -X theirs origin main
            git push
          fi
