<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>農業データポータル</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
:root{
  --page:#eef3f7;--surface:#fbfdfe;--surface2:#f2f6fa;--ink:#13243a;--ink2:#4a5b72;--line:#d9e2ec;
  --gold:#e2a42c;--navy:#17304f;--navy-ink:#f3f7fb;
  --s1:#2a78d6;--s2:#c9501f;--s3:#1baf7a;--bar:#2a78d6;
  --ok:#1b7f5a;--warn:#8a5f00;--ng:#5d6c82;
  --shadow:0 1px 2px rgba(19,36,58,.06),0 4px 14px rgba(19,36,58,.05);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --page:#0c1623;--surface:#132235;--surface2:#183049;--ink:#eaf0f6;--ink2:#a9b8cb;--line:#25405c;
    --navy:#0a1220;--navy-ink:#eaf0f6;--s1:#5b9cf0;--s2:#f08350;--s3:#199e70;--bar:#3987e5;
    --ok:#4cc79a;--warn:#e0b04a;--ng:#8fa0b7;--shadow:none;
  }
}
:root[data-theme="dark"]{
  --page:#0c1623;--surface:#132235;--surface2:#183049;--ink:#eaf0f6;--ink2:#a9b8cb;--line:#25405c;
  --navy:#0a1220;--navy-ink:#eaf0f6;--s1:#5b9cf0;--s2:#f08350;--s3:#199e70;--bar:#3987e5;
  --ok:#4cc79a;--warn:#e0b04a;--ng:#8fa0b7;--shadow:none;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--page);color:var(--ink);font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic UI",Meiryo,sans-serif;line-height:1.7;font-size:15px;-webkit-text-size-adjust:100%}
a{color:var(--s1)}
.num{font-variant-numeric:tabular-nums}
header.top{background:var(--navy);color:var(--navy-ink);border-bottom:3px solid var(--gold)}
.top .in{max-width:1280px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.top h1{font-size:19px;margin:0;font-weight:700;letter-spacing:.02em}
.top .sub{font-size:12.5px;opacity:.9;margin-left:auto}
.top .sub b{color:var(--gold);font-weight:700}
.warnbar{background:#7a2a2a;color:#fff;padding:8px 20px;font-size:13px;text-align:center}
.wrap{max-width:1280px;margin:0 auto;padding:20px;display:grid;grid-template-columns:200px 1fr;gap:22px}
nav.side{position:sticky;top:12px;align-self:start}
nav.side h2{font-size:12px;color:var(--ink2);margin:0 0 8px;font-weight:500;letter-spacing:.06em}
nav.side button{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;background:none;border:0;border-left:3px solid transparent;padding:8px 10px;color:var(--ink);font:inherit;font-size:14px;cursor:pointer;border-radius:0 6px 6px 0}
nav.side button:hover{background:var(--surface2)}
nav.side button[aria-pressed="true"]{background:var(--surface);border-left-color:var(--gold);font-weight:700;box-shadow:var(--shadow)}
nav.side .c{font-size:12px;color:var(--ink2)}
main{min-width:0}
.lead{margin:0 0 16px;color:var(--ink2);font-size:13.5px}
.spot{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px}
.spot .card{background:var(--navy);color:var(--navy-ink);border-radius:10px;padding:16px 18px;position:relative;overflow:hidden}
.spot .card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--gold)}
.spot .tag{font-size:11.5px;color:var(--gold);letter-spacing:.08em;font-weight:700}
.spot h3{margin:4px 0 6px;font-size:16px;line-height:1.5}
.spot p{margin:0;font-size:13.5px;opacity:.95}
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:20px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;box-shadow:var(--shadow)}
.kpi .t{font-size:12px;color:var(--ink2);line-height:1.5;min-height:36px}
.kpi .v{font-size:25px;font-weight:700;margin-top:2px;line-height:1.2;overflow-wrap:anywhere}
.kpi .v small{font-size:12px;font-weight:500;color:var(--ink2);margin-left:3px}
.kpi .d{margin-top:4px;font-size:12px}
.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
.tools input[type=search]{flex:1 1 220px;min-width:0;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font:inherit}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface);flex-wrap:wrap}
.seg button{border:0;background:none;color:var(--ink);padding:8px 12px;font:inherit;font-size:13px;cursor:pointer;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--navy);color:var(--navy-ink)}
.chk{font-size:13px;display:flex;align-items:center;gap:6px;color:var(--ink2)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:6px;min-width:0}
.tile .cat{font-size:11.5px;color:var(--ink2);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tile h3{margin:0;font-size:14.5px;line-height:1.5;font-weight:700}
.val{font-size:30px;font-weight:700;line-height:1.2;overflow-wrap:anywhere}
.val small{font-size:13px;font-weight:500;color:var(--ink2);margin-left:4px}
.chip{display:inline-block;font-size:11px;padding:1px 8px;border-radius:99px;border:1px solid var(--line);color:var(--ink2);background:var(--surface2);white-space:nowrap}
.chip.new{background:var(--gold);border-color:var(--gold);color:#2a1d00;font-weight:700}
.chip.auto{border-color:var(--s1);color:var(--s1)}
.chip.est{border-color:var(--warn);color:var(--warn)}
.delta{font-size:13px;font-weight:500}
.delta.up{color:var(--s1)}.delta.down{color:var(--s2)}.delta.flat{color:var(--ink2)}
.meta{font-size:12px;color:var(--ink2);line-height:1.6;margin-top:2px}
.meta b{color:var(--ink);font-weight:500}
.chkd{font-size:11px;color:var(--ink2)}
.viz{margin:4px 0}
.spark{width:100%;height:auto;display:block}
.spark .ax{font-size:10.5px;fill:var(--ink2)}
.spark .ln{fill:none;stroke:var(--s1);stroke-width:2;stroke-linejoin:round}
.spark .dot{fill:var(--surface);stroke:var(--s1);stroke-width:2}
.spark .hit{fill:transparent;cursor:crosshair}
.bars{display:grid;gap:7px}
.brow .bh{display:flex;justify-content:space-between;font-size:12.5px;gap:8px}
.brow .bh span:last-child{font-weight:700;white-space:nowrap}
.brow .bt{height:8px;background:var(--surface2);border-radius:4px;overflow:hidden;margin-top:2px}
.brow .bt i{display:block;height:100%;background:var(--bar);border-radius:4px}
.brow .bn{font-size:11.5px;color:var(--ink2)}
.plain{display:grid;gap:6px}
details.more{margin-top:auto;border-top:1px dashed var(--line);padding-top:8px;font-size:12.5px}
details.more summary{cursor:pointer;color:var(--s1);font-weight:500}
details.more .q{margin:8px 0;padding:8px 10px;background:var(--surface2);border-left:3px solid var(--gold);color:var(--ink);font-size:12.5px;line-height:1.7;overflow-wrap:anywhere}
details.more p{margin:6px 0;color:var(--ink2)}
details.more .src a{overflow-wrap:anywhere}
.caution{color:var(--warn)}
.tbwrap{overflow-x:auto;border-radius:10px;box-shadow:var(--shadow)}
table.tb{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--line);font-size:13px}
.tb th,.tb td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.tb th{background:var(--surface2);font-weight:700;font-size:12px;color:var(--ink2);white-space:nowrap}
.tb td.r{text-align:right;white-space:nowrap}
.tb tr:last-child td{border-bottom:0}
h2.sec{font-size:17px;margin:34px 0 4px;padding-left:10px;border-left:4px solid var(--gold)}
.pill{display:inline-block;font-size:11.5px;padding:1px 9px;border-radius:99px;font-weight:700;white-space:nowrap}
.pill.ok{color:var(--ok);border:1px solid var(--ok)}
.pill.wip{color:var(--warn);border:1px solid var(--warn)}
.pill.ng{color:var(--ng);border:1px solid var(--ng)}
.empty{padding:28px;text-align:center;color:var(--ink2);background:var(--surface);border:1px dashed var(--line);border-radius:10px}
footer{max-width:1280px;margin:0 auto;padding:6px 20px 40px;color:var(--ink2);font-size:12.5px}
footer p{margin:4px 0}
#tip{position:fixed;z-index:50;pointer-events:none;background:var(--navy);color:var(--navy-ink);font-size:12px;padding:4px 9px;border-radius:6px;display:none;white-space:nowrap}
.legend{font-size:12px;color:var(--ink2);display:flex;gap:14px;flex-wrap:wrap;margin:0 0 12px}
.legend .up{color:var(--s1)}.legend .down{color:var(--s2)}
@media (max-width:900px){
  .wrap{grid-template-columns:1fr;padding:14px 16px}
  nav.side{position:static;display:flex;overflow-x:auto;gap:6px;padding-bottom:4px}
  nav.side h2{display:none}
  nav.side button{width:auto;white-space:nowrap;gap:8px;border:1px solid var(--line);border-radius:99px;background:var(--surface);padding:6px 12px}
  nav.side button[aria-pressed="true"]{border-color:var(--gold);box-shadow:none}
  .spot{grid-template-columns:1fr}
  .kpis{grid-template-columns:repeat(2,1fr)}
  .kpi:last-child{grid-column:span 2}
  .grid{grid-template-columns:1fr}
  .top .sub{margin-left:0}
}
</style>
</head>
<body>
<header class="top"><div class="in">
  <h1>農業データポータル</h1>
  <div class="sub" id="sub"></div>
</div></header>
<div id="warn"></div>
<div class="wrap">
  <nav class="side" id="nav" aria-label="分野"></nav>
  <main>
    <p class="lead" id="lead"></p>
    <section class="spot" id="spot" aria-label="注目の指標"></section>
    <section class="kpis" id="kpis" aria-label="主な指標"></section>
    <div class="tools">
      <input type="search" id="q" placeholder="数字の名前で探す(例: 米、肥料、牛)" aria-label="検索">
      <div class="seg" id="aud" role="group" aria-label="見る人"></div>
      <label class="chk"><input type="checkbox" id="onlyNew"> 30日以内に公表されたもの</label>
      <div class="seg" id="mode" role="group" aria-label="表示の形">
        <button data-m="tile" aria-pressed="true">カード</button>
        <button data-m="table" aria-pressed="false">表</button>
      </div>
    </div>
    <p class="legend"><span class="up">▲ 増えた・上がった</span><span class="down">▼ 減った・下がった</span><span>色は良し悪しではなく、増減の向きです</span></p>
    <div id="list"></div>
    <h2 class="sec" id="catalog-h">出典カタログ</h2>
    <p class="lead">載せている数字の出典の一覧です。</p>
    <div class="tbwrap"><table class="tb" id="catalog"></table></div>
  </main>
</div>
<footer id="foot"></footer>
<div id="tip" role="status"></div>

<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtDate=iso=>{const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(iso||"");return m?`${m[1]}年${+m[2]}月${+m[3]}日`:""};
const arrow={up:"▲",down:"▼",flat:"―"};
let D=null,S={cat:"all",aud:"all",q:"",onlyNew:false,mode:"tile",cstat:"all"};

async function load(){
  try{
    const r=await fetch("data.json",{cache:"no-store"});
    if(!r.ok)throw new Error("http "+r.status);
    return {data:await r.json(),fallback:false};
  }catch(e){
    try{
      const t=$("embedded").textContent.replace(/^\/\*EMBED_START\*\//,"").replace(/\/\*EMBED_END\*\/$/,"");
      const d=JSON.parse(t);
      if(d&&Array.isArray(d.items)&&d.items.length)return {data:d,fallback:true};
    }catch(e2){}
    return null;
  }
}
const daysBetween=(a,b)=>Math.round((new Date(b)-new Date(a))/86400000);
const isNew=it=>{if(!it.published)return false;const n=daysBetween(it.published,D.checked_at);return n>=0&&n<=30};
const byId=id=>D.items.find(x=>x.id===id);
const catName=id=>(D.categories.find(c=>c.id===id)||{}).name||"";

function deltaHtml(it,cls){
  const d=it.delta;if(!d)return"";
  return `<div class="${cls||""} delta ${d.dir}"><span aria-hidden="true">${arrow[d.dir]}</span> ${esc(d.text)}</div>`;
}
function valHtml(it){
  return `<div class="val num">${esc(it.value)}<small>${esc(it.unit)}</small></div>`;
}
function sparkHtml(it){
  const s=it.series;if(!s)return"";
  const W=260,H=64,px=14,py=10,n=s.values.length;
  const mn=Math.min(...s.values),mx=Math.max(...s.values),rg=mx-mn;
  const X=i=>px+(n===1?0:i*(W-2*px)/(n-1));
  const Y=v=>rg===0?H/2:py+(H-2*py)*(1-(v-mn)/rg);
  const pts=s.values.map((v,i)=>[X(i),Y(v)]);
  const u=(s.unit&&!/=/.test(s.unit))?s.unit:"";
  const fmt=v=>v.toLocaleString("ja-JP")+u;
  const line=pts.map(p=>p.join(",")).join(" ");
  const circles=pts.map((p,i)=>`<circle class="dot" cx="${p[0]}" cy="${p[1]}" r="${i===n-1?4:2.5}"/><circle class="hit" cx="${p[0]}" cy="${p[1]}" r="11" data-tip="${esc(s.labels[i]+": "+fmt(s.values[i]))}"/>`).join("");
  return `<div class="viz"><svg class="spark" viewBox="0 0 ${W} ${H+14}" role="img" aria-label="${esc(it.title)}の推移。${esc(s.labels[0])}は${esc(fmt(s.values[0]))}、${esc(s.labels[n-1])}は${esc(fmt(s.values[n-1]))}">
   <polyline class="ln" points="${line}"/>${circles}
   <text class="ax" x="${px}" y="${H+10}" text-anchor="start">${esc(s.labels[0])}: ${esc(fmt(s.values[0]))}</text>
   <text class="ax" x="${W-px}" y="${H+10}" text-anchor="end">${esc(s.labels[n-1])}: ${esc(fmt(s.values[n-1]))}</text></svg></div>`;
}
function breakHtml(it){
  const b=it.breakdown;if(!b||!b.length)return"";
  if(it.bars){
    const mx=it.bar_max||Math.max(...b.map(x=>x.num));
    return `<div class="viz bars">`+b.map(x=>`<div class="brow"><div class="bh"><span>${esc(x.name)}</span><span class="num">${esc(x.value)}</span></div><div class="bt"><i style="width:${Math.max(2,Math.min(100,x.num/mx*100))}%"></i></div><div class="bn">${esc(x.note)}</div></div>`).join("")+`</div>`;
  }
  return `<div class="viz plain">`+b.map(x=>`<div class="brow"><div class="bh"><span>${esc(x.name)}</span><span class="num">${esc(x.value)}</span></div><div class="bn">${esc(x.note)}</div></div>`).join("")+`</div>`;
}
function moreHtml(it){
  let h=`<details class="more"><summary>原文と出典を見る</summary>`;
  h+=`<div class="q">${esc(it.quote)}</div>`;
  if(it.quote_note)h+=`<p class="caution">${esc(it.quote_note)}</p>`;
  if(it.breakdown_quote){h+=`<div class="q">${esc(it.breakdown_quote)}</div>`;if(it.breakdown_note)h+=`<p class="caution">${esc(it.breakdown_note)}</p>`;}
  if(it.version_note)h+=`<p><b>この数字について:</b> ${esc(it.version_note)}</p>`;
  if(it.explain)h+=`<p>${esc(it.explain)}</p>`;
  if(it.history&&it.history.length)h+=`<p><b>以前の版:</b> `+it.history.map(x=>`${esc(x.label)} ${esc(x.value)}(${esc(fmtDate(x.published))}公表。${esc(x.note)})`).join("、")+`</p>`;
  h+=`<p class="src"><b>出典:</b> <a href="${esc(it.source_url)}" target="_blank" rel="noopener">${esc(it.source_name)}</a>`;
  if(it.source2_url)h+=`<br><a href="${esc(it.source2_url)}" target="_blank" rel="noopener">${esc(it.source2_name)}</a>`;
  if(it.series&&it.series.source_url)h+=`<br>前月の値: <a href="${esc(it.series.source_url)}" target="_blank" rel="noopener">農林水産省「農業物価指数(2026年8月)」</a>`;
  h+=`</p></details>`;
  return h;
}
function pubText(it){
  return it.published?`${fmtDate(it.published)}公表`:(it.published_note||"公表日の記載なし");
}
function tileHtml(it){
  const est=/予想|速報|推定|見込|予報/.test(it.version)?" est":"";
  return `<article class="tile" id="t-${esc(it.id)}">
   <div class="cat"><span>${esc(catName(it.cat))}</span>${isNew(it)?'<span class="chip new">新着</span>':""}<span class="chip${est}">${esc(it.version)}</span>${it.auto?'<span class="chip auto">自動更新</span>':""}</div>
   <h3>${esc(it.title)}</h3>
   ${valHtml(it)}${deltaHtml(it)}${sparkHtml(it)}${breakHtml(it)}
   <div class="meta"><b>${esc(it.basis)}</b><br>${esc(pubText(it))}<br>出典: ${esc(it.source_name)}<br><span class="chkd">最終確認 ${esc(fmtDate(it.checked))}</span></div>
   ${moreHtml(it)}
  </article>`;
}
function tableHtml(items){
  const rows=items.map(it=>`<tr><td>${esc(catName(it.cat))}</td><td><a href="#t-${esc(it.id)}" data-jump="${esc(it.id)}">${esc(it.title)}</a></td><td class="r num"><b>${esc(it.value)}</b> ${esc(it.unit)}</td><td>${it.delta?esc(arrow[it.delta.dir]+" "+it.delta.text):""}</td><td>${esc(it.basis)}</td><td>${esc(it.version)}</td><td>${esc(pubText(it))}</td><td>${esc(fmtDate(it.checked))}</td><td><a href="${esc(it.source_url)}" target="_blank" rel="noopener">${esc(it.source_name)}</a></td></tr>`).join("");
  return `<div class="tbwrap"><table class="tb"><thead><tr><th>分野</th><th>名前</th><th>数字</th><th>増減</th><th>対象の時期</th><th>版</th><th>公表日</th><th>最終確認</th><th>出典</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}
function filtered(){
  const q=S.q.trim().toLowerCase();
  return D.items.filter(it=>
    (S.cat==="all"||it.cat===S.cat)&&
    (S.aud==="all"||(it.aud||[]).includes(S.aud))&&
    (!S.onlyNew||isNew(it))&&
    (!q||(it.title+it.basis+catName(it.cat)+it.source_name).toLowerCase().includes(q)));
}
function renderList(){
  const items=filtered();
  if(!items.length){$("list").innerHTML=`<div class="empty">条件に合う数字がありません。検索や絞り込みを変えてみてください。</div>`;return}
  $("list").innerHTML=S.mode==="table"?tableHtml(items):`<div class="grid">${items.map(tileHtml).join("")}</div>`;
}
function renderNav(){
  const c={all:D.items.length};D.items.forEach(i=>c[i.cat]=(c[i.cat]||0)+1);
  const mk=(id,n)=>`<button data-c="${id}" aria-pressed="${S.cat===id}"><span>${esc(n)}</span><span class="c num">${c[id]||0}</span></button>`;
  $("nav").innerHTML=`<h2>分野</h2>`+mk("all","すべて")+D.categories.filter(x=>c[x.id]).map(x=>mk(x.id,x.name)).join("");
}
function renderCatalog(){
  const rows=D.catalog.map(c=>`<tr><td>${esc(c.org)}</td><td><a href="${esc(c.url)}" target="_blank" rel="noopener">${esc(c.name)}</a></td><td>${esc(c.note)}</td></tr>`).join("");
  $("catalog").innerHTML=`<thead><tr><th>機関</th><th>統計</th><th>載せている内容</th></tr></thead><tbody>${rows}</tbody>`;
}
function renderTop(fallback){
  $("sub").innerHTML=`数字の確認日: <b>${esc(fmtDate(D.checked_at))}</b>`;
  $("lead").textContent=D.note;
  $("warn").innerHTML=fallback?`<div class="warnbar">data.json を読めなかったため、ファイルに入っている控えを表示しています。公開したサイトでは、この表示は出ません。</div>`:"";
  $("spot").innerHTML=D.spotlight.map(s=>`<div class="card"><div class="tag">注目の指標</div><h3>${esc(s.title)}</h3><p>${esc(s.body)}</p></div>`).join("");
  $("kpis").innerHTML=D.kpis.map(id=>{const it=byId(id);if(!it)return"";
    return `<a class="kpi" style="text-decoration:none;color:inherit" href="#t-${esc(id)}" data-jump="${esc(id)}"><div class="t">${esc(it.title)}</div><div class="v num">${esc(it.value)}<small>${esc(it.unit)}</small></div>${deltaHtml(it,"d")}</a>`}).join("");
  const au=["all","農家","商社","メーカー"];
  $("aud").innerHTML=au.map(a=>`<button data-a="${a}" aria-pressed="${S.aud===a}">${a==="all"?"だれでも":a+"向け"}</button>`).join("");
  $("foot").innerHTML=`<p>数字は、各機関が公表した値を、出典のページで確認して写したものです。使う前に、出典のページで見比べてください。正しさの基準は、各機関の公表資料です。</p>
  <p>政府統計の数字は、e-Stat(政府統計の総合窓口)の利用規約にしたがい、出典を表示しています。国の機関は、これらの数字の正しさを保証していません。</p>
  <p>調査には、概数・速報・確定値などの版があります。数字のあとで版が変わることがあります。このサイトは、版を表示し、変わったときは以前の版を残します。</p>
  <p>「自動更新」の印が付いた数字は、毎週、新しい公表がないか確認して、あれば入れ替えます。「最終確認」は、その数字を最後に確認した日です。全国の統計が中心です。</p>`;
}
function renderAll(fb){renderTop(fb);renderNav();renderList();renderCatalog()}
function setPressed(el,attr,val){[...el.children].forEach(b=>b.setAttribute("aria-pressed",b.dataset[attr]===val))}
document.addEventListener("click",e=>{
  const t=e.target.closest("button,[data-jump]");if(!t)return;
  if(t.dataset.c){S.cat=t.dataset.c;renderNav();renderList()}
  else if(t.dataset.a){S.aud=t.dataset.a;setPressed($("aud"),"a",S.aud);renderList()}
  else if(t.dataset.m){S.mode=t.dataset.m;setPressed($("mode"),"m",S.mode);renderList()}
  else if(t.dataset.jump){e.preventDefault();S.cat="all";S.aud="all";S.q="";S.onlyNew=false;S.mode="tile";$("q").value="";$("onlyNew").checked=false;
    setPressed($("mode"),"m","tile");setPressed($("aud"),"a","all");renderNav();renderList();
    const el=$("t-"+t.dataset.jump);if(el){el.scrollIntoView({behavior:"smooth",block:"center"});const d=el.querySelector("details");if(d)d.open=true}}
});
$("q").addEventListener("input",e=>{S.q=e.target.value;renderList()});
$("onlyNew").addEventListener("change",e=>{S.onlyNew=e.target.checked;renderList()});
const tip=$("tip");
document.addEventListener("pointerover",e=>{const h=e.target.closest("[data-tip]");if(!h)return;tip.textContent=h.dataset.tip;tip.style.display="block"});
document.addEventListener("pointermove",e=>{if(tip.style.display==="block"){tip.style.left=Math.min(innerWidth-tip.offsetWidth-8,e.clientX+12)+"px";tip.style.top=(e.clientY+14)+"px"}});
document.addEventListener("pointerout",e=>{if(e.target.closest("[data-tip]"))tip.style.display="none"});
load().then(r=>{
  if(!r){$("list").innerHTML=`<div class="empty">データを読み込めませんでした。ページを読み込み直してください。</div>`;return}
  D=r.data;renderAll(r.fallback);
});
</script>
